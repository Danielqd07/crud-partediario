<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{parte.detail.title}">Detalle del parte diario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container main-content">
    <h1 th:text="#{parte.detail.title}">Detalle del parte diario</h1>
    <section class="card detail-card">
        <div class="detail-row"><span class="detail-label" th:text="#{parte.field.id}">ID</span><span th:text="${parte.id}">1</span></div>
        <div class="detail-row"><span class="detail-label" th:text="#{parte.field.fecha}">Fecha</span><span th:text="${#temporals.format(parte.fecha, 'dd/MM/yyyy')}">17/11/2026</span></div>
        <div class="detail-row"><span class="detail-label" th:text="#{parte.field.estado}">Estado</span><span class="badge" th:text="${parte.estado}">PENDIENTE</span></div>
        <div class="detail-row"><span class="detail-label" th:text="#{parte.field.encargado}">Encargado</span><span th:text="${parte.encargadoNombre}">Daniel García</span></div>
        <div class="detail-block"><span class="detail-label" th:text="#{parte.field.textoDictado}">Texto dictado</span><p th:text="${parte.textoDictado}">Texto</p></div>
    </section>
    <div class="form-actions">
        <a class="button secondary" th:href="@{/partes/{id}/editar(id=${parte.id})}" th:text="#{parte.action.edit}">Editar</a>
        <a class="button" th:href="@{/partes}" th:text="#{parte.action.back}">Volver</a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
