services:
  mariadb:
    image: mariadb:11.4
    container_name: crud-partediario-db-nuevo
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: crud-partediario
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - crud-partediario-data:/var/lib/mysql
volumes:
  crud-partediario-data:
